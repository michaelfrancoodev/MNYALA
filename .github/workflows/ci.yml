name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mnyala
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mnyala_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnyala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://mnyala:ci-only-password@localhost:5432/mnyala_test
      TEST_DATABASE_URL: postgresql://mnyala:ci-only-password@localhost:5432/mnyala_test
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint --max-warnings 0
      - run: pnpm test
      - name: Schema and migrations must not drift
        run: |
          pnpm db:generate
          git diff --exit-code drizzle
          test -z "$(git ls-files --others --exclude-standard drizzle)"
          pnpm db:check
      - run: pnpm build
      - name: End-to-end tests (real server over HTTP)
        run: pnpm test:e2e:only
